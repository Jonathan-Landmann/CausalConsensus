[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-consensus"
version = "0.1.0"
description = "Stability-weighted subgraph aggregation for causal discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jonathan Landmann"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
causal-consensus = "causal_consensus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

